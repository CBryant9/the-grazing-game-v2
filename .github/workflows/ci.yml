name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and engine tests
        run: pnpm test
      - name: Speed of the daily tick
        # The target is 5 ms a day with 4,000+ head on a developer machine
        # (docs/CALIBRATION.md). Shared CI machines are slower, so the limit
        # here is looser. It still catches a tick that has become slow.
        run: pnpm test:speed
        env:
          GG_SPEED_LIMIT_MS: 15
      - name: Build
        run: pnpm build
      - name: The rules stay hidden (no engine text in the browser JavaScript)
        run: pnpm check:browser-bundle
      - name: Lighthouse (mobile) on the main pages
        run: pnpm lighthouse
